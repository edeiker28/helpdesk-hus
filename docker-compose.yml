version: "3.9"

services:

  db:
    image: mariadb:11.4
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_seguro
      MARIADB_DATABASE: helpdesk_db
      MARIADB_USER: helpdesk_user
      MARIADB_PASSWORD: helpdesk_pass
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - helpdesk_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk_network

volumes:
  mariadb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  helpdesk_network:
    driver: bridge