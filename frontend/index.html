<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk HUS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ── LOGIN ─────────────────────────────────────────────── -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <i class="fas fa-hospital"></i>
                    <h1>HelpDesk HUS</h1>
                    <p>Hospital Universitario de Sincelejo</p>
                </div>
                <div id="login-error" class="alert alert-error hidden"></div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="usuario@hus.gov.co">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary btn-block" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- ── APP PRINCIPAL ─────────────────────────────────────── -->
    <div id="app-page" class="page hidden">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-hospital"></i>
                <span>HelpDesk HUS</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" onclick="showSection('dashboard')">
                    <i class="fas fa-chart-bar"></i> Dashboard
                </a>
                <a href="#" class="nav-item" onclick="showSection('tickets')">
                    <i class="fas fa-ticket-alt"></i> Tickets
                </a>
                <a href="#" class="nav-item" onclick="showSection('incidents')">
                    <i class="fas fa-exclamation-triangle"></i> Incidentes
                </a>
                <a href="#" class="nav-item" onclick="showSection('notifications')">
                    <i class="fas fa-bell"></i> Notificaciones
                    <span id="notif-badge" class="badge hidden">0</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <div id="user-name">Usuario</div>
                        <div id="user-role" class="user-role"></div>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Header -->
            <div class="topbar">
                <h2 id="section-title">Dashboard</h2>
            </div>

            <!-- Dashboard -->
            <div id="section-dashboard" class="section active">
                <div class="metrics-grid">
                    <div class="metric-card blue">
                        <i class="fas fa-ticket-alt"></i>
                        <div class="metric-info">
                            <span class="metric-value" id="m-open">0</span>
                            <span class="metric-label">Tickets Abiertos</span>
                        </div>
                    </div>
                    <div class="metric-card yellow">
                        <i class="fas fa-spinner"></i>
                        <div class="metric-info">
                            <span class="metric-value" id="m-progress">0</span>
                            <span class="metric-label">En Progreso</span>
                        </div>
                    </div>
                    <div class="metric-card green">
                        <i class="fas fa-check-circle"></i>
                        <div class="metric-info">
                            <span class="metric-value" id="m-resolved">0</span>
                            <span class="metric-label">Resueltos</span>
                        </div>
                    </div>
                    <div class="metric-card red">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div class="metric-info">
                            <span class="metric-value" id="m-incidents">0</span>
                            <span class="metric-label">Incidentes Activos</span>
                        </div>
                    </div>
                </div>

                <div class="cards-row">
                    <div class="card">
                        <h3>Tickets por Prioridad</h3>
                        <div class="priority-list" id="priority-list"></div>
                    </div>
                    <div class="card">
                        <h3>Resumen General</h3>
                        <div id="summary-list"></div>
                    </div>
                </div>
            </div>

            <!-- Tickets -->
            <div id="section-tickets" class="section hidden">
                <div class="section-header">
                    <h3>Mis Tickets</h3>
                    <button class="btn btn-primary" onclick="showCreateTicket()">
                        <i class="fas fa-plus"></i> Nuevo Ticket
                    </button>
                </div>

                <!-- Formulario crear ticket -->
                <div id="create-ticket-form" class="card hidden">
                    <h3>Crear Nuevo Ticket</h3>
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="t-title" placeholder="Descripción breve del problema">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="t-description" placeholder="Describe el problema con detalle..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="t-category">
                                <option value="hardware">Hardware</option>
                                <option value="software">Software</option>
                                <option value="network">Red</option>
                                <option value="access">Acceso</option>
                                <option value="printers">Impresoras</option>
                                <option value="telephony">Telefonía</option>
                                <option value="medical_equipment">Equipo Médico</option>
                                <option value="other">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Prioridad</label>
                            <select id="t-priority">
                                <option value="low">Baja</option>
                                <option value="medium" selected>Media</option>
                                <option value="high">Alta</option>
                                <option value="critical">Crítica</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="hideCreateTicket()">Cancelar</button>
                        <button class="btn btn-primary" onclick="createTicket()">
                            <i class="fas fa-save"></i> Crear Ticket
                        </button>
                    </div>
                </div>

                <div id="tickets-list" class="tickets-list"></div>
            </div>

            <!-- Incidentes -->
            <div id="section-incidents" class="section hidden">
                <div class="section-header">
                    <h3>Incidentes</h3>
                </div>
                <div id="incidents-list" class="tickets-list"></div>
            </div>

            <!-- Notificaciones -->
            <div id="section-notifications" class="section hidden">
                <div class="section-header">
                    <h3>Notificaciones</h3>
                    <button class="btn btn-secondary" onclick="markAllRead()">
                        <i class="fas fa-check-double"></i> Marcar todas como leídas
                    </button>
                </div>
                <div id="notifications-list"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
